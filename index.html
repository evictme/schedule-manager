<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}body{padding-bottom:88px}.app{max-width:760px;margin:0 auto;padding:14px 12px 24px}header{position:sticky;top:0;z-index:5;background:linear-gradient(#fffdf8 70%,rgba(255,253,248,.92));border-bottom:1px solid var(--line);padding:12px 12px 10px;box-shadow:0 1px 10px rgba(0,0,0,.04)}.header-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent2);object-fit:cover;border:1px solid var(--line)}h1{font-size:18px;line-height:1.1;margin:0}h2,h3{margin:0 0 10px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.sync{font-size:11px;color:var(--muted);margin-top:2px}.sync.dirty{color:var(--warn);font-weight:800}.sync.ok{color:var(--good);font-weight:800}.top-actions{margin-left:auto;display:flex;gap:6px}.top-actions button{padding:8px 9px;font-size:13px}nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fffdf8;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}nav button.active{background:var(--accent2);color:var(--accent)}nav span{font-size:18px;line-height:1}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 0}.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}label{display:flex;flex-dire .shift-head.next-clear{align-items:flex-start}
.shift-datebox{min-width:62px;text-align:center;border:1px solid var(--line);border-radius:13px;background:var(--accent2);padding:8px 6px;font-weight:900;color:var(--accent)}

@media(max-width:430px){.share-popover{right:8px;left:8px;top:70px;width:auto}.shift-datebox{min-width:56px}}

/* v10 mobile status bar, business logos, next-shift stack, log exporters */
.sync{position:relative;overflow:hidden;display:inline-block;min-width:min(100%,280px);max-width:100%;padding:5px 10px;border-radius:999px;background:linear-gradient(90deg,#9aa0a6,#6f7479);color:#fff!important;font-weight:900;line-height:1.15;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);--progress:0%}
.sync::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--progress,0%);background:linear-gradient(90deg,#1f7a4a,#36a56a);transition:width .35s ease;z-index:0}.sync::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));z-index:1}.sync{z-index:0}.sync .sync-text{position:relative;z-index:2}.sync.ok{--progress:100%}.sync.dirty{--progress:38%}.sync.working{--progress:68%}
.next-stack{display:grid;gap:8px;margin-top:10px}.shift-rank{width:30px;height:30px;border-radius:999px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--accent);flex:0 0 auto}.shift-logo{width:42px;height:42px;border-radius:13px;object-fit:cover;background:var(--accent2);border:1px solid var(--line);flex:0 0 auto}.shift-logo.letter{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;border-color:transparent}.next-left{display:flex;gap:8px;align-items:flex-start}.shift-head.next-clear{justify-content:flex-start}.shift-datebox{flex:0 0 auto}.log-export-menu{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.log-export-menu button{white-space:nowrap}.business-logo-preview{width:48px;height:48px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--accent2)}
@media(max-width:430px){.sync{min-width:210px;font-size:10px}.shift-logo{width:38px;height:38px}.shift-rank{width:28px;height:28px}.log-export-menu{width:100%}}


/* v12 mobile-first layout and drill-down menus */
.mobile-menu-btn{display:none;margin-left:auto;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:12px;min-width:42px;min-height:42px;padding:8px 10px;font-size:22px;line-height:1;font-weight:900}
.mobile-header-menu{position:fixed;right:10px;top:72px;z-index:40;width:min(94vw,360px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.2);padding:12px}.mobile-header-menu.hide{display:none!important}.mobile-header-menu h3{margin:0 0 8px}.mobile-menu-list{display:grid;gap:8px}.mobile-menu-list button{width:100%;justify-content:flex-start}.mobile-menu-list .secondary{background:#fff}.setup-selector-card{position:sticky;top:74px;z-index:3}.setup-business-panel{display:grid;gap:10px}.setup-location-filter{margin-top:10px}.setup-selected-note{font-size:12px;color:var(--muted);margin-top:6px}.app,header .header-inner{width:100%;max-width:760px}.app{overflow-x:hidden}.card,.daygroup,.shift{max-width:100%}
@media(max-width:430px){html,body{width:100%;overflow-x:hidden}.app{max-width:430px;margin:0 auto;padding:10px 10px 24px}.header-inner{max-width:430px}.top-actions{display:none}.mobile-menu-btn{display:inline-flex;align-items:center;justify-content:center}.share-popover,.mobile-header-menu{right:8px;left:8px;top:72px;width:auto}.sync{display:block;width:100%;min-width:0;max-width:calc(100vw - 86px);font-size:10px;white-space:nowrap;text-overflow:ellipsis}.header-inner>div:nth-child(2){min-width:0;flex:1}h1{font-size:17px}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filterbar{padding-bottom:10px}.filterbar button{min-height:40px}.setup-selector-card{top:68px}.setup-business-panel .business-card{margin-top:8px}.business-card .grid.two{grid-template-columns:1fr}.location-filter-title{display:block;margin-bottom:6px}.row.between{align-items:flex-start}.kpis{grid-template-columns:1fr 1fr}.shift-head.next-clear,.shift-head{gap:8px}.next-left{gap:7px}.shift-datebox{min-width:52px;padding:7px 5px}.shift-logo{width:36px;height:36px}.shift-rank{width:26px;height:26px}.daybadge{min-width:50px}.log-export-menu{display:grid;grid-template-columns:repeat(2,1fr);overflow:visible}.log-export-menu button{width:100%}input,select,textarea,button,.btn{font-size:16px}.grid.three{grid-template-columns:1fr}.share-panel{display:none!important}}

</style>

<body>
<header><div class="header-inner"><img id="logoImg" class="logo" alt="Logo"><div><h1 id="title">Schedule Manager</h1><div class="sub" id="subtitle">Multi-business mobile schedule tracker</div><div class="sync" id="syncStatus">Autosaved locally</div></div><div class="top-actions"><button id="importBtn" class="secondary">Import</button><button id="backupBtn" class="secondary">Backup</button><button id="shareMenuBtn" class="secondary">Share</button><button id="googleSyncBtn" class="secondary">Sync</button><button id="quickIcs" class="secondary">Add All</button></div></div></header>
<nav class="no-print"><button data-tab="home" class="active"><span>⌂</span>Home</button><button data-tab="paste"><span>＋</span>Paste</button><button data-tab="log"><span>☰</span>Log</button><button data-tab="pay"><span>$</span>Pay</button><button data-tab="setup"><span>⚙</span>Setup</button></nav>
<div class="app"><section id="home" class="tab"></section><section id="paste" class="tab hide"></section><section id="log" class="tab hide"></section><section id="pay" class="tab hide"></section><section id="setup" class="tab hide"></section></div>
<input class="hide" type="file" id="jsonImport" accept="application/json">
<script>
const STORE='workScheduleManager.multi.v2';
const LEGACY_KEYS=['workScheduleManager.general.v1','personalScheduleManager.v1'];
const APP_VERSION=4;
const COLORS=['#315c49','#6b4f9c','#1f6f8b','#8a5a1b','#8f3f3f','#3f6b35','#7a3b75','#50545c'];
const STATE_TAX_RATES={NONE:0,AL:0.05,AK:0,AZ:0.025,AR:0.039,CA:0.093,CO:0.044,CT:0.05,DE:0.055,FL:0,GA:0.0539,HI:0.07,ID:0.058,IL:0.0495,IN:0.03,IA:0.038,KS:0.052,KY:0.04,LA:0.03,ME:0.058,MD:0.0475,MA:0.05,MI:0.0425,MN:0.068,MS:0.047,MO:0.047,MT:0.059,NE:0.052,NN:0,NV:0,NH:0,NJ:0.0637,NM:0.049,NY:0.0597,NC:0.0399,ND:0.02,OH:0.035,OK:0.0475,OR:0.0875,PA:0.0307,RI:0.0475,SC:0.062,SD:0,TN:0,TX:0,UT:0.0455,VT:0.066,VA:0.0575,WA:0,WV:0.047,WI:0.053,WY:0,DC:0.065};
const STATE_NAMES={NONE:'Custom / No State Tax',AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NN:'No State Selected',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',DC:'District of Columbia'};
const STATE_ORDER=['NONE','AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
const seedText=`Monday 4/27: OFF\n\nTuesday 4/28: 9am Main Location\n\nWednesday 4/29: 9am Main Location\n\nThursday 4/30: 10am Back Office\n\nFriday 5/1: 12pm-8pm Main Location\n\nSaturday 5/2: 11am-7pm Event Site\n(Training shift)\n\nSunday 5/3: OFF`;
const defaultBusiness={id:'biz-main',name:'My Workplace',color:'#315c49',hourlyRate:15,stateCode:'NONE',ilTax:0,ficaTax:.0765,federalTax:.10,payPeriodAnchor:'2026-04-20',payPeriodDays:14,paydayOffset:5,defaultShiftHours:8,defaultEndIfMissing:true,defaultLocation:'Main Location',calendarTitlePrefix:'Work',locations:[{name:'Main Location',color:'',useBusinessColor:true},{name:'Back Office',color:'#1f6f8b',useBusinessColor:false},{name:'Event Site',color:'#8a5a1b',useBusinessColor:false},{name:'Remote',color:'#6b4f9c',useBusinessColor:false},{name:'Training',color:'#3f6b35',useBusinessColor:false}]};
const defaultState={version:APP_VERSION,settings:{employeeName:'Your Name',logoData:'',googleScriptUrl:'',googleScriptSecret:'',activeBusinessId:'biz-main',homeFilter:'ALL',payFilter:'ALL',shareFilter:'ALL'},businesses:[defaultBusiness],shifts:sampleShifts('biz-main'),logs:[]};
function sampleShifts(businessId){return[{id:uid(),businessId,date:'2026-04-27',day:'MON',start:'',end:'',status:'Off',location:'',notes:'Sample off day',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},{id:uid(),businessId,date:'2026-04-28',day:'TUE',start:'09:00',end:'',status:'Scheduled',location:'Main Location',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},{id:uid(),businessId,date:'2026-04-29',day:'WED',start:'09:00',end:'',status:'Scheduled',location:'Main Location',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},{id:uid(),businessId,date:'2026-04-30',day:'THU',start:'10:00',end:'',status:'Scheduled',location:'Back Office',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},{id:uid(),businessId,date:'2026-05-01',day:'FRI',start:'12:00',end:'20:00',status:'Scheduled',location:'Main Location',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},{id:uid(),businessId,date:'2026-05-02',day:'SAT',start:'11:00',end:'19:00',status:'Scheduled',location:'Event Site',notes:'Training shift',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},{id:uid(),businessId,date:'2026-05-03',day:'SUN',start:'',end:'',status:'Off',location:'',notes:'Sample off day',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''}]}
let state=loadState();let parsedPreview=[];let openShiftId=null;let openEditorId=null;let activeTab='home';ensureState();saveSilent();
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.version>=2)return s}catch(e){}for(const key of LEGACY_KEYS){try{const old=JSON.parse(localStorage.getItem(key));if(old&&old.settings)return migrateLegacy(old)}catch(e){}}const s=clone(defaultState);s.logs=[makeLog('Sample schedule',s.shifts,seedText)];return s}
function migrateLegacy(old){const b={...clone(defaultBusiness),id:'biz-main',name:old.settings.businessName||'My Workplace',hourlyRate:num(old.settings.hourlyRate,15),stateCode:old.settings.stateCode||'NONE',ilTax:num(old.settings.ilTax,STATE_TAX_RATES[old.settings.stateCode||'NONE']||0),ficaTax:num(old.settings.ficaTax,.0765),federalTax:num(old.settings.federalTax,.10),payPeriodAnchor:old.settings.payPeriodAnchor||'2026-04-20',payPeriodDays:num(old.settings.payPeriodDays,14),paydayOffset:num(old.settings.paydayOffset,5),defaultShiftHours:num(old.settings.defaultShiftHours,8),defaultLocation:old.settings.defaultLocation||'Main Location',calendarTitlePrefix:old.settings.calendarTitlePrefix||'Work',locations:stringToLocations(old.settings.locations||old.settings.defaultLocation||'Main Location', '#315c49')};return{version:APP_VERSION,settings:{employeeName:old.settings.employeeName||'Your Name',logoData:old.settings.logoData||'',googleScriptUrl:old.settings.googleScriptUrl||'',googleScriptSecret:old.settings.googleScriptSecret||'',activeBusinessId:b.id,homeFilter:'ALL',payFilter:'ALL',shareFilter:'ALL'},businesses:[b],shifts:(old.shifts||[]).map(s=>({...s,id:s.id||uid(),businessId:b.id,calendarEventId:s.calendarEventId||''})),logs:(old.logs||[]).map(l=>({...l,shifts:(l.shifts||[]).map(s=>({...s,id:s.id||uid(),businessId:s.businessId||b.id}))}))}}
function ensureState(){const previousVersion=num(state.version,0);if(!state.version)state.version=APP_VERSION;if(!state.settings)state.settings={};if(!Array.isArray(state.businesses)||!state.businesses.length)state.businesses=[clone(defaultBusiness)];state.businesses=state.businesses.map((b,i)=>ensureBusiness(b,i));if(!Array.isArray(state.shifts))state.shifts=[];state.shifts=state.shifts.map(s=>ensureShift(s));if(!Array.isArray(state.logs))state.logs=[];if(!state.settings.employeeName)state.settings.employeeName='Your Name';if(!('logoData'in state.settings))state.settings.logoData='';if(!('googleScriptUrl'in state.settings))state.settings.googleScriptUrl='';if(!('googleScriptSecret'in state.settings))state.settings.googleScriptSecret='';if(!state.settings.activeBusinessId||!businessById(state.settings.activeBusinessId))state.settings.activeBusinessId=state.businesses[0].id;if(!state.settings.homeFilter)state.settings.homeFilter='ALL';if(!state.settings.payFilter)state.settings.payFilter='ALL';if(!state.settings.shareFilter)state.settings.shareFilter='ALL';if(!state.settings.pasteDrafts)state.settings.pasteDrafts={};if(previousVersion<3){state.businesses.forEach(b=>{if(b.federalTax===0)b.federalTax=.10})}if(previousVersion<4){state.businesses.forEach(b=>{state.settings.pasteDrafts[b.id]=state.settings.pasteDrafts[b.id]||businessPasteText(b.id)})}state.version=APP_VERSION}
function ensureBusiness(b,i=0){let d=clone(defaultBusiness);b={...d,...(b||{})};b.id=b.id||uid();b.name=b.name||'Workplace '+(i+1);b.color=b.color||COLORS[i%COLORS.length];b.stateCode=b.stateCode||'NONE';b.hourlyRate=num(b.hourlyRate,15);b.ilTax=num(b.ilTax,STATE_TAX_RATES[b.stateCode]||0);b.ficaTax=num(b.ficaTax,.0765);b.federalTax=num(b.federalTax,.10);b.payPeriodDays=num(b.payPeriodDays,14);b.paydayOffset=num(b.paydayOffset,5);b.defaultShiftHours=num(b.defaultShiftHours,8);b.locations=Array.isArray(b.locations)?b.locations:stringToLocations(b.locations||b.defaultLocation||'Main Location',b.color);b.locations=b.locations.map((l,idx)=>({name:l.name||('Location '+(idx+1)),color:l.useBusinessColor?'':(l.color||''),useBusinessColor:l.useBusinessColor!==undefined?!!l.useBusinessColor:!l.color}));if(!b.locations.length)b.locations=[{name:b.defaultLocation||'Main Location',color:'',useBusinessColor:true}];b.defaultLocation=b.defaultLocation||b.locations[0].name;b.calendarTitlePrefix=b.calendarTitlePrefix||b.name||'Work';return b}

function num(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}function todayISO(){return new Date().toISOString().slice(0,10)}function dateObj(iso){return new Date(iso+'T00:00:00')}function dateAdd(iso,d){const x=dateObj(iso);x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}function mdy(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return `${m}/${d}`}function day3(iso){return ['SUN','MON','TUE','WED','THU','FRI','SAT'][dateObj(iso).getDay()]}function fmtTime(t,ampm=true){if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}${ampm?ap:''}`}function timeRange(s,e){if(!s)return'';return e?`${fmtTime(s,false)}-${fmtTime(e,true)}`:fmtTime(s,true)}function timeToNum(t){const [h,m]=String(t||'0:0').split(':').map(Number);return h+(m||0)/60}function numToTime(n){n=((n%24)+24)%24;let h=Math.floor(n),m=Math.round((n-h)*60);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}function money(n){return '$'+(Number(n)||0).toFixed(2)}
function businessById(id){return state.businesses.find(b=>b.id===id)}function businessName(id){return (businessById(id)||{}).name||'Unknown'}function activeBusiness(){return businessById(state.settings.activeBusinessId)||state.businesses[0]}function locationObj(b,loc){b=b||activeBusiness();return (b.locations||[]).find(l=>String(l.name).toLowerCase()===String(loc).toLowerCase())||null}function shiftColor(s){if(s.status!=='Scheduled')return '#a33a3a';const b=businessById(s.businessId)||activeBusiness();return (locationObj(b,s.location)||{}).color||b.color||'#315c49'}function hours(sh){const b=businessById(sh.businessId)||activeBusiness();if(sh.status!=='Scheduled'||!sh.start)return 0;let s=timeToNum(sh.start),e=sh.end?timeToNum(sh.end):s+b.defaultShiftHours;if(e<s)e+=24;return Math.max(0,+(e-s).toFixed(2))}function calc(sh){const b=businessById(sh.businessId)||activeBusiness();const h=hours(sh),gross=h*b.hourlyRate,il=gross*b.ilTax,fica=gross*b.ficaTax,fed=gross*b.federalTax,tax=il+fica+fed;return{hours:h,gross,il,fica,fed,tax,net:gross-tax}}
function payPeriod(date,b){b=b||activeBusiness();let start=dateObj(b.payPeriodAnchor),d=dateObj(date),len=num(b.payPeriodDays,14);while(start>d)start.setDate(start.getDate()-len);while(new Date(start.getTime()+len*864e5)<=d)start.setDate(start.getDate()+len);let end=new Date(start);end.setDate(end.getDate()+len-1);let pay=new Date(end);pay.setDate(pay.getDate()+num(b.paydayOffset,0));return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10),payday:pay.toISOString().slice(0,10)}}function weekId(shifts){const dates=(shifts||[]).map(s=>s.date).sort();return dates[0]||''}function makeLog(label,shifts,source){return{id:uid(),label,importedAt:new Date().toISOString(),weekStart:weekId(shifts),source:source||'',shifts:clone(shifts)}}

function svgLogo(){return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" rx="24" fill="#e8f1ea"/><text x="48" y="57" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#315c49">WS</text></svg>`)}function refreshHeader(){document.getElementById('title').textContent='Schedule Manager';document.getElementById('subtitle').textContent=`${state.settings.employeeName||'My'} schedule · ${state.businesses.length} business${state.businesses.length===1?'':'es'} · ${state.shifts.length} entries`;document.getElementById('logoImg').src=state.settings.logoData||svgLogo()}

function parseScheduleText(txt,biz){const lines=txt.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);let results=[],last=null,baseYear=new Date().getFullYear();for(const line of lines){const dayMatch=line.match(/\b(mon(day)?|tue(sday)?|wed(nesday)?|thu(rsday)?|fri(day)?|sat(urday)?|sun(day)?)\b/i);const dateMatch=line.match(/(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/);const parenNotes=[];let m;const parenRegex=/\(([^)]*)\)/g;while((m=parenRegex.exec(line))!==null){const note=(m[1]||'').trim();if(note)parenNotes.push(note)}const mainLine=line.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();const mainAfterDate=dateMatch?mainLine.slice(mainLine.indexOf(dateMatch[0])+dateMatch[0].length).replace(/^\s*:?\s*/,'').trim():mainLine.replace(/^\s*[A-Za-z]+:?\s*/,'').trim();const timeRangeMatch=mainAfterDate.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|to|–|—)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);const oneTimeMatch=mainAfterDate.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);const isOffMain=/\boff\b|unavailable|not scheduled/i.test(mainAfterDate);if(dayMatch||dateMatch||timeRangeMatch||oneTimeMatch||isOffMain){let d=dateMatch?makeISO(dateMatch,baseYear):(last?dateAdd(last.date,1):todayISO());let start='',end='',status='Off';if(!isOffMain){if(timeRangeMatch){start=normTime(timeRangeMatch[1],timeRangeMatch[2],timeRangeMatch[3]||timeRangeMatch[6]||'');end=normTime(timeRangeMatch[4],timeRangeMatch[5],timeRangeMatch[6]||timeRangeMatch[3]||'');status='Scheduled'}else if(oneTimeMatch){start=normTime(oneTimeMatch[1],oneTimeMatch[2],oneTimeMatch[3]);status='Scheduled'}}let clean=mainAfterDate.replace(timeRangeMatch?timeRangeMatch[0]:'','').replace(!timeRangeMatch&&oneTimeMatch?oneTimeMatch[0]:'','').replace(/\boff\b/ig,'').replace(/unavailable|not scheduled/ig,'').replace(/[():]+/g,' ').replace(/\s+/g,' ').trim();let loc='',notes='';if(status==='Scheduled'){const known=(biz.locations||[]).map(l=>l.name);const knownMain=known.find(k=>clean.toLowerCase().inc function scheduleShareLines(filter=state.settings.shareFilter||'ALL'){return shiftsForFilter(filter).map(s=>{const b=businessById(s.businessId)||activeBusiness();const day=s.day||day3(s.date),date=mdy(s.date);if(s.status!=='Scheduled')return `${day} | ${date} | OFF | | | ${b.name}`;return `${day} | ${date} | ${fmtTime(s.start,true)} | ${s.end?fmtTime(s.end,true):''} | ${s.location||''} | ${b.name}`})}async function shareSchedule(type){const lines=scheduleShareLines().join('\n'),filter=state.settings.shareFilter||'ALL',label=filter==='ALL'?'All Businesses':businessName(filter);if(type==='text'){if(navigator.share)try{await navigator.share({title:'Work Schedule',text:lines});return}catch(e){}try{await navigator.clipboard.writeText(lines);alert('Schedule copied to clipboard.')}catch(e){alert(lines)}return}const dataUrl=makeScheduleImage(lines,label,type);downloadDataUrl(dataUrl,`schedule.${type==='jpeg'?'jpg':'png'}`)}function makeScheduleImage(text,label,type){const lines=String(text).split('\n'),w=1100,pad=48,row=34,h=pad*2+70+lines.length*row;const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,w,h);ctx.fillStyle='#202124';ctx.font='bold 34px Arial';ctx.fillText('Work Schedule - '+label,pad,pad);ctx.font='22px Arial';ctx.fillStyle='#6b6f76';ctx.fillText('Day | Date | Start | End | Location | Business',pad,pad+42);ctx.font='24px Arial';ctx.fillStyle='#202124';lines.forEach((line,i)=>ctx.fillText(line,pad,pad+86+i*row));return c.toDataURL(type==='jpeg'?'image/jpeg':'image/png',.92)}function downloadDataUrl(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}

function setStatusProgress(msg,mode='',progress=0,autoStable=false){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync '+(mode||'');
  el.style.setProperty('--progress',String(progress||0)+'%');
  el.innerHTML='<span class="sync-text">'+esc(msg)+'</span>';
  if(autoStable){
    clearTimeout(window.__statusStableTimer);
    window.__statusStableTimer=setTimeout(()=>setStatusProgress('Autosaved locally · ready','',0,false),2200);
  }
}
updateSyncStatus=function(msg,mode=''){
  const progress=mode==='ok'?100:(mode==='dirty'?35:(mode==='working'?70:0));
  setStatusProgress(msg,mode,progress,(mode==='ok'||(mode==='dirty'&&String(msg).toLowerCase().includes('autosaved'))));
};

function businessInitials(name){return String(name||'Work').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'W'}
function businessLogoHtml(b,small=false){
  b=b||activeBusiness();
  if(b.logoData)return `<img class="shift-logo" src="${esc(b.logoData)}" alt="${esc(b.name||'Business')} logo">`;
  return `<div class="shift-logo letter" style="background:${esc(b.color||'#315c49')}">${esc(businessInitials(b.name))}</div>`;
}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
/**
 * Return exactly one upcoming scheduled shift per business.
 * - ALL: first upcoming shift for every configured business.
 * - Business filter: first upcoming shift for that selected business only.
 * This keeps the Next Shift panel compact while preserving the full schedule below.
 */
function nextScheduledShifts(filter='ALL'){
  const scopedBusinesses = filter === 'ALL'
    ? state.businesses
    : state.businesses.filter(b => b.id === filter);

  return scopedBusinesses
    .map(b => upcoming(b.id).find(s => s.status === 'Scheduled' && s.start))
    .filter(Boolean)
    .sort((a,b) =>
      a.date.localeCompare(b.date) ||
      String(a.start).localeCompare(String(b.start)) ||
      businessName(a.businessId).localeCompare(businessName(b.businessId))
    );
}

syncPayloadToGoogle=async function(days,successMsg,fullSync=false){
  const url=String(state.settings.googleScriptUrl||'').trim(),secret=String(state.settings.googleScriptSecret||'').trim();
  if(!url){updateSyncStatus('Add Apps Script URL in Setup','dirty');return;}
  if(!secret){updateSyncStatus('Add secret key in Setup','dirty');return;}
  if(!days.length){updateSyncStatus('No schedule days to sync','dirty');return;}
  const payload=googleCalendarPayload(days,fullSync);
  const body=JSON.stringify(payload);
  setStatusProgress('Sending to Google Calendar...', 'working', 25, false);
  let confirmed=false,lastError='';
  try{
    setStatusProgress('Contacting Google Calendar...', 'working', 55, false);
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body});
    const txt=await res.text();let data=null;try{data=JSON.parse(txt)}catch(e){}
    if(data&&data.ok===false)throw new Error(data.error||'Apps Script returned failure');
    if(!res.ok)throw new Error('HTTP '+res.status+' '+txt.slice(0,180));
    confirmed=true;
  }catch(err){lastError=err&&err.message?err.message:String(err)}
  if(confirmed){const msg=successMsg||`Google synced · ${days.length} schedules sent`;setStatusProgress(msg,'ok',100,true);return;}
  try{
    setStatusProgress('Sending via mobile fallback...', 'working', 70, false);
    const getUrl=buildGoogleSyncGetUrl(url,body);
    if(getUrl.length>=7500)throw new Error('Payload too large for phone GET sync. Reduce notes or sync fewer days.');
    postGoogleSyncViaHiddenGet(getUrl);
    const msg=successMsg||`Google sync sent · ${days.length} schedules sent`;
    setStatusProgress(msg,'ok',100,true);
  }catch(err){setStatusProgress('Google sync could not be sent','dirty',35,false);console.warn('Google sync failed',err,lastError);}
};

function logRows(){
  const rows=[['Log Label','Imported At','Week Start','Business','Date','Day','Status','Start','End','Location','Notes','Hours','Gross','Net']];
  (state.logs||[]).forEach(l=>{(l.shifts||[]).forEach(s=>{const c=calc(s);rows.push([l.label||'Schedule',l.importedAt||'',l.weekStart||'',businessName(s.businessId),s.date||'',s.day||day3(s.date),s.status||'',s.start||'',s.end||'',s.location||'',s.notes||'',c.hours.toFixed(2),c.gross.toFixed(2),c.net.toFixed(2)])})});
  return rows;
}
function csvEscape(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportLogCSV(){downloadBlob(logRows().map(r=>r.map(csvEscape).join(',')).join('\n'),'schedule-log.csv','text/csv')}
function exportLogExcel(){const html='<table>'+logRows().map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';downloadBlob(html,'schedule-log.xls','application/vnd.ms-excel')}
function exportLogWord(){const body='<h1>Schedule Log</h1>'+logRows().map((r,i)=>i===0?'<h3>'+r.join(' | ')+'</h3>':'<p>'+r.map(esc).join(' | ')+'</p>').join('');downloadBlob('<html><body>'+body+'</body></html>','schedule-log.doc','application/msword')}
function exportLogPDF(){const lines=logRows().map(r=>r.join(' | '));downloadBlob(makeSimplePDF(lines),'schedule-log.pdf','application/pdf')}
function makeSimplePDF(lines){
  const safe=lines.join('\n').replace(/[\\()]/g,'\\$&').slice(0,50000).split('\n');
  let y=760,content='BT /F1 8 Tf 36 '+y+' Td ';
  safe.forEach((line,i)=>{if(i>0){content+='0 -12 Td '}content+='('+line.slice(0,155)+') Tj ';});
  content+='ET';
  const objs=[];objs.push('1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj');objs.push('2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj');objs.push('3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj');objs.push('4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj');objs.push('5 0 obj << /Length '+content.length+' >> stream\n'+content+'\nendstream endobj');let pdf='%PDF-1.4\n',xref=[];objs.forEach(o=>{xref.push(pdf.length);pdf+=o+'\n'});let start=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';xref.forEach(x=>pdf+=String(x).padStart(10,'0')+' 00000 n \n');pdf+='trailer << /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF';return pdf;
}
function logTextForImage(){return logRows().map(r=>r.join(' | ')).join('\n')}
function exportLogImage(type){const dataUrl=makeScheduleImage(logTextForImage(),'Schedule Log',type);downloadDataUrl(dataUrl,`schedule-log.${type==='jpeg'?'jpg':'png'}`)}
function exportLogMenuHtml(){return `<div class="log-export-menu"><button class="secondary" onclick="exportLogCSV()">CSV</button><button class="secondary" onclick="exportLogExcel()">Excel</button><button class="secondary" onclick="exportLogWord()">Word</button><button class="secondary" onclick="exportLogPDF()">PDF</button><button class="secondary" onclick="exportLogImage('png')">PNG</button><button class="secondary" onclick="exportLogImage('jpeg')">JPEG</button><button class="danger" onclick="clearLogs()">Clear</button></div>`}

/* === v12 mobile-first overrides: burger header menu + setup drill-down selectors === */

  document.addEventListener('click',function(e){
    const menu=document.getElementById('mobileHeaderMenu');

  function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function businessLogoMini(b){return b&&b.logoData?'<img src="'+esc(b.logoData)+'" alt="" style="width:18px;height:18px;border-radius:6px;object-fit:cover">':''}
  function locationDisplayColor(b,loc){return loc&&loc.useBusinessColor?b.color:(loc&&loc.color)||b.color||'#315c49'}

  function businessSelectorHtml(current){
    let html='<div class="filterbar"><button class="'+(current==='ALL'?'active':'secondary')+'" onclick="setSetupBusinessFilter(\'ALL\')">All</button>';
    state.businesses.forEach(function(b,i){

  }

  function locationRowsHtmlFiltered(b){
    const selected=setupLocationFilter(b.id);

    const rows=selected==='ALL'?all:all.filter(function(l){return l.name===selected});
    if(!rows.length)return '<p class="notice">No matching location selected.</p>';
    return rows.map(function(loc){
      const originalIndex=all.findIndex(function(l){return l===loc});
      const i=originalIndex>=0?originalIndex:0;
      const useBiz=loc.useBusinessColor!==false&&!loc.color;
      const pickerColor=useBiz?(b.color||'#315c49'):(loc.color||b.color||'#315c49');
      return '<div class="grid three" style="align-items:end;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff">'

    }).join('');

  const oldBusinessSetupHtmlForV12=businessSetupHtml;

      +'<div class="card"><h3>Data Backup / Restore</h3><p class="notice">The app autosaves locally to this browser. Download JSON before changing devices or clearing browser data.</p><div class="grid two"><button onclick="downloadJSON()">Download JSON</button><label class="btn secondary">Import JSON<input class="hide" type="file" id="jsonFile" accept="application/json"></label><button class="danger" onclick="resetAll()">Reset Example</button><button class="secondary" onclick="print()">Print</button></div></div>';

    document.getElementById('logoFile').onchange=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(){state.settings.logoData=r.result;save();renderSetup()};r.readAsDataURL(f)};
    ['googleScriptUrl','googleScriptSecret'].forEach(function(id){document.getElementById(id).onchange=function(e){state.settings[id]=e.target.value;save();renderSetup()}});
    document.getElementById('jsonFile').onchange=function(e){importJSON(e.target.files[0])};
  };

  const oldRefreshHeaderForV12=refreshHeader;

})();
