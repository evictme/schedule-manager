<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personal Schedule Manager</title>
<style>
:root{
  --bg:#f5f3ee;--card:#fffdf8;--ink:#202124;--muted:#6b6f76;--line:#ded8cc;
  --accent:#315c49;--accent2:#e8f1ea;--bad:#a33a3a;--badbg:#fff0f0;--good:#246b45;--warn:#8a5a1b;
  --shadow:0 4px 18px rgba(30,35,32,.08);--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body{padding-bottom:88px}.app{max-width:720px;margin:0 auto;padding:14px 12px 24px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#fffdf8 70%,rgba(255,253,248,.92));border-bottom:1px solid var(--line);padding:12px 12px 10px;box-shadow:0 1px 10px rgba(0,0,0,.04)}
.header-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent2);object-fit:cover;border:1px solid var(--line)}
h1{font-size:18px;line-height:1.1;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.sync{font-size:11px;color:var(--muted);margin-top:2px}.sync.dirty{color:var(--warn);font-weight:800}.sync.ok{color:var(--good);font-weight:800}.top-actions{margin-left:auto;display:flex;gap:6px}.top-actions button{padding:8px 9px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fffdf8;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}nav button.active{background:var(--accent2);color:var(--accent)}nav span{font-size:18px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 0}.card.tight{padding:10px}.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:#384139}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--ink);font:inherit;min-height:44px}textarea{min-height:170px;resize:vertical;line-height:1.35}button,.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:11px 13px;font-weight:800;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}button.secondary,.btn.secondary{background:#fff;color:var(--accent)}button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}button.warn{background:#fff;color:var(--warn);border-color:var(--warn)}button:disabled{opacity:.45}.full{width:100%}.hide{display:none!important}.notice{font-size:13px;color:var(--muted);line-height:1.35}.small{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{background:var(--accent2);border-radius:15px;padding:10px}.kpi b{font-size:20px;display:block}.kpi span{font-size:12px;color:var(--muted);font-weight:700}.shift{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}.shift.off{background:var(--badbg);border-color:#efc7c7}.shift.today{outline:2px solid var(--accent)}.shift-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.daybadge{min-width:52px;text-align:center;background:var(--accent2);border-radius:12px;padding:7px 6px;font-weight:900}.off .daybadge{background:#ffe0e0;color:var(--bad)}.daybadge span{display:block;font-size:11px;color:var(--muted);font-weight:800}.shift-main{flex:1}.shift-title{font-size:18px;font-weight:900}.shift-meta{font-size:13px;color:var(--muted);margin-top:3px}.money{font-variant-numeric:tabular-nums;font-weight:900}.pill{display:inline-block;border-radius:999px;background:var(--accent2);padding:3px 8px;font-size:12px;font-weight:800;color:var(--accent)}.pill.bad{background:#ffe1e1;color:var(--bad)}.pill.warn{background:#fff1dc;color:var(--warn)}
.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table th{font-size:11px;color:var(--muted);text-align:left}.table td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-size:13px}.table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}.raw{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:260px;overflow:auto;font-size:12px}.tabs{display:flex;gap:6px;background:#eee9df;border-radius:14px;padding:4px;margin:8px 0}.tabs button{flex:1;min-height:36px;padding:7px;border:0;background:transparent;color:var(--muted);border-radius:11px;font-size:13px}.tabs button.active{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
@media(max-width:390px){.app{padding:10px 9px 24px}.grid.two,.grid.three{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.card{padding:12px}.shift-title{font-size:16px}button,.btn{padding:10px 11px}.header-inner{gap:8px}.logo{width:38px;height:38px}}
@media print{header,nav,.no-print{display:none!important}body{background:#fff}.app{max-width:100%;padding:0}.card{box-shadow:none;border:0}}

/* Mobile inline editor + share controls */
.shift{cursor:pointer}
.shift:focus{outline:2px solid var(--accent);outline-offset:2px}
.shift-tools{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.shift-tools .menu-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.shift-tools button{width:100%;min-height:40px;padding:9px;font-size:13px}
.inline-editor{background:#f8f5ee;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.inline-editor textarea{min-height:80px}
.share-panel .grid{margin-top:10px}
@media(max-width:390px){.shift-tools .menu-row{grid-template-columns:1fr}.share-panel .grid.two{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <img id="logoImg" class="logo" alt="Logo">
    <div><h1 id="title">Schedule Manager</h1><div class="sub" id="subtitle">Local mobile schedule tracker</div><div class="sync" id="syncStatus">Autosaved locally</div></div>
    <div class="top-actions"><button id="icloudLoadBtn" class="secondary">Load</button><button id="icloudSaveBtn" class="secondary">Save</button><button id="googleSyncBtn" class="secondary">Sync</button><button id="quickIcs" class="secondary">Add All</button></div>
  </div>
</header>
<nav class="no-print">
  <button data-tab="home" class="active"><span>⌂</span>Home</button>
  <button data-tab="paste"><span>＋</span>Paste</button>
  <button data-tab="log"><span>☰</span>Log</button>
  <button data-tab="pay"><span>$</span>Pay</button>
  <button data-tab="setup"><span>⚙</span>Setup</button>
</nav>
<div class="app">
  <section id="home" class="tab"></section>
  <section id="paste" class="tab hide"></section>
  <section id="log" class="tab hide"></section>
  <section id="pay" class="tab hide"></section>
  <section id="setup" class="tab hide"></section>
</div>
<script>
const STORE='personalScheduleManager.v1';
const seedText=`Monday 4/27: OFF

Tuesday: 4/28: 8am U of C

Wednesday 4/29: 8am U of C

Thursday 4/30: 10am Prep Shift

Friday 5/1: 8am OFF

Saturday 5/2: 11am-8:30pm (James Off)
(Catering 3pm-7pm at U of C)

Sunday 5/3: OFF`;
const defaultState={
  settings:{businessName:'The Fat Shallot',employeeName:'Edwin',logoData:'',hourlyRate:17,ilTax:.0495,ficaTax:.0765,federalTax:.10,payPeriodAnchor:'2026-04-20',payPeriodDays:14,paydayOffset:5,defaultShiftHours:9,defaultEndIfMissing:true,defaultLocation:'U of C',calendarTitlePrefix:'The Fat Shallot',googleScriptUrl:'',googleScriptSecret:''},
  currentWeekId:'',
  shifts:[
    {date:'2026-04-27',day:'MON',start:'',end:'',status:'Off',location:'',notes:'Monday 4/27: OFF',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},
    {date:'2026-04-28',day:'TUE',start:'08:00',end:'',status:'Scheduled',location:'U of C',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:'0a57efurv4cotpt0gfcerfuf30@google.com'},
    {date:'2026-04-29',day:'WED',start:'08:00',end:'',status:'Scheduled',location:'U of C',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:'dcb0d8220748puhons49v957hs@google.com'},
    {date:'2026-04-30',day:'THU',start:'10:00',end:'',status:'Scheduled',location:'Prep Shift',notes:'',source:seedText,importedAt:new Date().toISOString(),calendarEventId:'7u8sqjjnfcbt39pq49bmcbo41k@google.com'},
    {date:'2026-05-01',day:'FRI',start:'',end:'',status:'Off',location:'',notes:'Friday 5/1: 8am OFF',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''},
    {date:'2026-05-02',day:'SAT',start:'11:00',end:'20:30',status:'Scheduled',location:'U of C',notes:'James Off | Catering 3pm-7pm at U of C',source:seedText,importedAt:new Date().toISOString(),calendarEventId:'02o75go01ia8bf7cdtto6b73v8@google.com'},
    {date:'2026-05-03',day:'SUN',start:'',end:'',status:'Off',location:'',notes:'Sunday 5/3: OFF',source:seedText,importedAt:new Date().toISOString(),calendarEventId:''}
  ],
  logs:[]
};
let state=load();let parsedPreview=[];let dataFileHandle=null;let dirty=false;let lastLoadedFileName='data.json';ensureSettingsDefaults();
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.settings)return s}catch(e){}const s=JSON.parse(JSON.stringify(defaultState));s.currentWeekId=weekId(s.shifts);s.logs=[makeLog('Initial spreadsheet example',s.shifts,seedText)];return s}
function ensureSettingsDefaults(){
  if(!state.settings)state.settings={};
  const d=defaultState.settings;
  ['businessName','employeeName','hourlyRate','ilTax','ficaTax','federalTax','payPeriodAnchor','payPeriodDays','paydayOffset','defaultShiftHours','defaultEndIfMissing','defaultLocation','calendarTitlePrefix','googleScriptUrl','googleScriptSecret'].forEach(k=>{
    if(state.settings[k]===undefined||state.settings[k]===null||state.settings[k]==='') state.settings[k]=d[k];
  });
}
function save(){
  localStorage.setItem(STORE,JSON.stringify(state));
  dirty=true;
  refreshHeader();
  updateSyncStatus('Autosaved locally · save to iCloud when done','dirty');
}
function markClean(msg='Saved to iCloud data file'){
  dirty=false;
  updateSyncStatus(msg,'ok');
}
function updateSyncStatus(msg,mode=''){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync '+mode;
  el.textContent=msg;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(){return new Date().toISOString().slice(0,10)}
function dateObj(iso){return new Date(iso+'T00:00:00')}
function dateAdd(iso,d){const x=dateObj(iso);x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function mdy(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return `${m}/${d}`}
function day3(iso){return ['SUN','MON','TUE','WED','THU','FRI','SAT'][dateObj(iso).getDay()]}
function fmtTime(t,ampm=true){if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}${ampm?ap:''}`}
function timeRange(s,e){if(!s)return'';return e?`${fmtTime(s,false)}-${fmtTime(e,true)}`:fmtTime(s,true)}
function hours(sh){if(sh.status!=='Scheduled'||!sh.start)return 0;let s=timeToNum(sh.start),e=sh.end?timeToNum(sh.end):s+state.settings.defaultShiftHours;if(e<s)e+=24;return Math.max(0,+(e-s).toFixed(2))}
function timeToNum(t){const [h,m]=t.split(':').map(Number);return h+m/60}
function money(n){return '$'+(Number(n)||0).toFixed(2)}
function calc(sh){const h=hours(sh),gross=h*state.settings.hourlyRate,il=gross*state.settings.ilTax,fica=gross*state.settings.ficaTax,fed=gross*state.settings.federalTax,tax=il+fica+fed;return{hours:h,gross,il,fica,fed,tax,net:gross-tax}}
function payPeriod(date){let start=dateObj(state.settings.payPeriodAnchor),d=dateObj(date),len=Number(state.settings.payPeriodDays)||14;while(start>d)start.setDate(start.getDate()-len);while(new Date(start.getTime()+len*864e5)<=d)start.setDate(start.getDate()+len);let end=new Date(start);end.setDate(end.getDate()+len-1);let pay=new Date(end);pay.setDate(pay.getDate()+(Number(state.settings.paydayOffset)||0));return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10),payday:pay.toISOString().slice(0,10)}}
function upcoming(){return state.shifts.filter(s=>s.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date))}
function nextShift(){return upcoming().find(s=>s.status==='Scheduled')||null}
function weekId(shifts){const dates=shifts.map(s=>s.date).sort();return dates[0]||''}
function makeLog(label,shifts,source){return{id:Date.now()+Math.random(),label,importedAt:new Date().toISOString(),weekStart:weekId(shifts),source:source||'',shifts:JSON.parse(JSON.stringify(shifts))}}
function refreshHeader(){document.getElementById('title').textContent=state.settings.businessName||'Schedule Manager';document.getElementById('subtitle').textContent=`${state.settings.employeeName||'My'} schedule · ${state.shifts.length} saved entries`;const img=document.getElementById('logoImg');img.src=state.settings.logoData||svgLogo()}
function svgLogo(){return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" rx="24" fill="#e8f1ea"/><text x="48" y="57" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#315c49">FS</text></svg>`)}
function showTab(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.tab').forEach(s=>s.classList.add('hide'));document.getElementById(id).classList.remove('hide');render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.getElementById('quickIcs').onclick=()=>downloadICS(upcoming().filter(s=>s.status==='Scheduled'),'upcoming_schedule.ics');document.getElementById('icloudLoadBtn').onclick=loadICloudData;document.getElementById('icloudSaveBtn').onclick=saveICloudData;document.getElementById('googleSyncBtn').onclick=syncToGoogleCalendar;
function render(){refreshHeader();renderHome();renderPaste();renderLog();renderPay();renderSetup()}
function renderHome(){const n=nextShift();const current=state.shifts.slice().sort((a,b)=>a.date.localeCompare(b.date));let k=summary(current);document.getElementById('home').innerHTML=`
<div class="card">
  <div class="row between"><div><b>Next Shift</b><div class="notice">Quick view for your phone</div></div><button class="secondary" onclick="showTab('paste')">Paste New</button></div>
  ${n?shiftCard(n,true):`<div class="shift off"><div class="shift-title">No upcoming scheduled shift</div><div class="notice">Paste or import your next schedule.</div></div>`}
</div>
<div class="kpis">
  <div class="kpi"><span>Upcoming Hours</span><b>${k.hours.toFixed(1)}</b></div>
  <div class="kpi"><span>Est. Gross</span><b>${money(k.gross)}</b></div>
  <div class="kpi"><span>Est. Take Home</span><b>${money(k.net)}</b></div>
  <div class="kpi"><span>Next Payday</span><b>${esc(k.payday?mdy(k.payday):'—')}</b></div>
</div>
<div class="card">
  <div class="row between"><b>Upcoming / Current Schedule</b><div class="row wrap"><button class="secondary" onclick="syncToGoogleCalendar()">Sync Google</button><button class="secondary" onclick="downloadICS(state.shifts.filter(s=>s.status==='Scheduled'),'schedule_with_alerts.ics')">Add All to Calendar</button></div></div>
  ${current.map(s=>shiftCard(s,false)).join('') || '<p class="notice">No schedule loaded.</p>'}
</div>`}
function shiftCard(s,big){const c=calc(s),isToday=s.date===todayISO(),off=s.status!=='Scheduled';return `<div class="shift ${off?'off':''} ${isToday?'today':''}"><div class="shift-head"><div class="daybadge">${esc(s.day||day3(s.date))}<span>${esc(mdy(s.date))}</span></div><div class="shift-main"><div class="shift-title">${off?esc(s.status||'Off'):esc(timeRange(s.start,s.end))}</div><div class="shift-meta">${esc(s.location||'')}${s.notes?' · '+esc(s.notes):''}</div>${!off?`<div class="shift-meta"><span class="pill">${c.hours.toFixed(1)} hrs</span> <span class="money">${money(c.net)} take-home est.</span></div>`:''}</div></div><div class="row wrap" style="margin-top:10px"><button class="secondary" onclick="editShift('${s.date}')">Edit</button>${big&&!off?`<button class="secondary" onclick="downloadICS([getShift('${s.date}')],'shift_${s.date}.ics')">Add Shift</button><a class="btn secondary" target="_blank" href="${googleLink(s)}">Google</a>`:''}</div></div>`}
function shiftIndexByDate(date){return (state.shifts||[]).findIndex(s=>s.date===date)}
function normalizeUserTime(value){
  value=String(value||'').trim();
  if(!value)return '';
  let m=value.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
  if(!m)return value;
  let h=Number(m[1]), min=m[2]?Number(m[2]):0, ap=(m[3]||'').toLowerCase();
  if(ap==='pm'&&h<12)h+=12;
  if(ap==='am'&&h===12)h=0;
  if(!ap&&h>=1&&h<=7)h+=12;
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}
function logCurrentBeforeEdit(reason){
  if(confirm('Save the current schedule to the log before editing?')){
    state.logs.unshift(makeLog(reason||'Manual edit backup',state.shifts,'Saved before manual edit'));
  }
}
function editShift(date){
  const i=shiftIndexByDate(date);
  if(i<0)return alert('Shift not found.');
  const sh=state.shifts[i];
  logCurrentBeforeEdit('Before editing '+(sh.day||day3(sh.date))+' '+mdy(sh.date));
  let status=prompt('Set status for '+(sh.day||day3(sh.date))+' '+mdy(sh.date)+'\n\nType Scheduled or Off:',sh.status||'Scheduled');
  if(status===null)return;
  status=status.trim().toLowerCase();
  if(status==='off' || status==='o'){
    sh.status='Off';
    sh.start='';
    sh.end='';
    sh.location='';
    sh.notes='';
    sh.calendarDelete=true;
    sh.editedAt=new Date().toISOString();
    save();render();
    return;
  }
  sh.status='Scheduled';
  const start=prompt('Start time? Examples: 8am, 1:30pm, 13:30',sh.start?fmtTime(sh.start,true):'');
  if(start===null)return;
  sh.start=normalizeUserTime(start);
  const end=prompt('End time? Leave blank if unknown.',sh.end?fmtTime(sh.end,true):'');
  if(end===null)return;
  sh.end=normalizeUserTime(end);
  const loc=prompt('Location?',sh.location||state.settings.defaultLocation||'');
  if(loc===null)return;
  sh.location=loc.trim();
  const notes=prompt('Notes? Leave blank if none.',sh.notes||'');
  if(notes===null)return;
  sh.notes=notes.trim();
  sh.calendarDelete=false;
  sh.editedAt=new Date().toISOString();
  save();render();
}
function getShift(date){return state.shifts.find(s=>s.date===date)}
function summary(shifts){let out={hours:0,gross:0,net:0,payday:''};shifts.filter(s=>s.status==='Scheduled').forEach(s=>{let c=calc(s);out.hours+=c.hours;out.gross+=c.gross;out.net+=c.net;if(!out.payday||payPeriod(s.date).payday<out.payday)out.payday=payPeriod(s.date).payday});return out}
function renderPaste(){document.getElementById('paste').innerHTML=`<div class="card"><h2>Paste Schedule</h2><p class="notice">Paste a schedule from email/text. The parser uses the main text after each date for Scheduled/Off status. Parentheses are saved as notes/secondary details only.</p><textarea id="pasteBox" placeholder="Paste schedule here...">${esc(seedText)}</textarea><div class="grid two" style="margin-top:10px"><button onclick="previewPaste()">Preview</button><button class="secondary" onclick="useSeed()">Use Example</button></div></div><div id="previewArea"></div>`;if(parsedPreview.length)drawPreview()}
function useSeed(){document.getElementById('pasteBox').value=seedText;previewPaste()}
function previewPaste(){const txt=document.getElementById('pasteBox').value;parsedPreview=parseScheduleText(txt);drawPreview(txt)}
function drawPreview(src){document.getElementById('previewArea').innerHTML=`<div class="card"><div class="row between"><b>Parsed Preview</b><span class="pill">${parsedPreview.length} lines</span></div>${parsedPreview.map(s=>shiftCard(s,false)).join('')}<div class="grid two"><button onclick="importPreview()">Save as Current</button><button class="secondary" onclick="appendPreview()">Add to Log Only</button></div></div>`}
function importPreview(){if(!parsedPreview.length)return alert('Preview first.');const src=document.getElementById('pasteBox').value;state.logs.unshift(makeLog('Imported schedule',parsedPreview,src));state.shifts=parsedPreview;state.currentWeekId=weekId(parsedPreview);save();parsedPreview=[];showTab('home')}
function appendPreview(){if(!parsedPreview.length)return alert('Preview first.');state.logs.unshift(makeLog('Log only',parsedPreview,document.getElementById('pasteBox').value));save();parsedPreview=[];showTab('log')}
function parseScheduleText(txt){
  const lines=txt.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
  let results=[],last=null,baseYear=new Date().getFullYear();

  for(const line of lines){
    const dayMatch=line.match(/\b(mon(day)?|tue(sday)?|wed(nesday)?|thu(rsday)?|fri(day)?|sat(urday)?|sun(day)?)\b/i);
    const dateMatch=line.match(/(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/);

    // Parentheses are intentionally ignored for determining Scheduled vs Off.
    // They are treated as notes/secondary location details only.
    const parenNotes=[];
    let m;
    const parenRegex=/\(([^)]*)\)/g;
    while((m=parenRegex.exec(line))!==null){
      const note=(m[1]||'').trim();
      if(note)parenNotes.push(note);
    }

    const mainLine=line.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
    const mainAfterDate=dateMatch
      ? mainLine.slice(mainLine.indexOf(dateMatch[0])+dateMatch[0].length).replace(/^\s*:?\s*/,'').trim()
      : mainLine.replace(/^\s*[A-Za-z]+:?\s*/,'').trim();

    const timeRangeMatch=mainAfterDate.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|to|–|—)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
    const oneTimeMatch=mainAfterDate.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);

    // OFF only counts when it appears outside parentheses, in the main schedule text.
    // This prevents notes like "(James Off)" from changing the employee schedule.
    const isOffMain=/\boff\b|unavailable|not scheduled/i.test(mainAfterDate);

    if(dayMatch||dateMatch||timeRangeMatch||oneTimeMatch||isOffMain){
      let d=dateMatch?makeISO(dateMatch,baseYear):(last?dateAdd(last.date,1):todayISO());
      let start='',end='',status='Off';

      if(!isOffMain){
        if(timeRangeMatch){
          start=normTime(timeRangeMatch[1],timeRangeMatch[2],timeRangeMatch[3]||timeRangeMatch[6]||'');
          end=normTime(timeRangeMatch[4],timeRangeMatch[5],timeRangeMatch[6]||timeRangeMatch[3]||'');
          status='Scheduled';
        }else if(oneTimeMatch){
          start=normTime(oneTimeMatch[1],oneTimeMatch[2],oneTimeMatch[3]);
          status='Scheduled';
        }
      }

      let clean=mainAfterDate
        .replace(timeRangeMatch?timeRangeMatch[0]:'','')
        .replace(!timeRangeMatch&&oneTimeMatch?oneTimeMatch[0]:'','')
        .replace(/\boff\b/ig,'')
        .replace(/unavailable|not scheduled/ig,'')
        .replace(/[():]+/g,' ')
        .replace(/\s+/g,' ')
        .trim();

      let loc='',notes='';
      if(status==='Scheduled'){
        const known=['U of C','Prep Shift','Catering','Commissary','Event'];
        const knownMain=known.find(k=>clean.toLowerCase().includes(k.toLowerCase()));
        loc=knownMain||clean||state.settings.defaultLocation;

        // Parenthetical time/location details are secondary schedule notes, not separate shifts.
        // Example: (Catering 3pm-7pm at U of C) stays as a note on the same day.
        notes=parenNotes.join(' | ');
      }else{
        loc='';
        notes=parenNotes.length?parenNotes.join(' | '):line;
      }

      last={
        date:d,
        day:day3(d),
        start,
        end,
        status,
        location:status==='Scheduled'?loc:'',
        notes,
        source:txt,
        importedAt:new Date().toISOString(),
        calendarEventId:'',
        calendarDelete:status!=='Scheduled'
      };
      results.push(last);
    }else if(last){
      // Continuation lines are notes only. Parenthetical continuation lines stay notes only.
      const extra=line.replace(/^\((.*)\)$/,'$1').trim();
      if(extra)last.notes=(last.notes?last.notes+' | ':'')+extra;
    }
  }
  return results.slice(0,14);
}
function makeISO(m,baseYear){let mo=+m[1],da=+m[2],yr=m[3]?+m[3]:baseYear;if(yr<100)yr+=2000;return `${yr}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`}

async function loadICloudData(){
  // Best case: browsers that support File System Access API keep a writable handle.
  if(window.showOpenFilePicker){
    try{
      [dataFileHandle]=await window.showOpenFilePicker({
        types:[{description:'Schedule JSON',accept:{'application/json':['.json']}}],
        multiple:false
      });
      const file=await dataFileHandle.getFile();
      lastLoadedFileName=file.name||'data.json';
      const text=await file.text();
      const loaded=JSON.parse(text);
      if(!loaded.settings||!Array.isArray(loaded.shifts)) throw new Error('Invalid schedule data file');
      state=loaded;
      localStorage.setItem(STORE,JSON.stringify(state));
      markClean('Loaded from '+lastLoadedFileName,'ok');
      render();
      return;
    }catch(err){
      if(err && err.name==='AbortError') return;
      alert('Could not load that file. Make sure it is your data.json schedule file.');
      return;
    }
  }
  // iPhone/Safari fallback: use a normal file picker.
  const picker=document.getElementById('icloudJsonFile');
  if(picker){ picker.value=''; picker.click(); }
  else alert('Use Setup > Load Data File.');
}
function loadSelectedICloudFile(file){
  if(!file)return;
  lastLoadedFileName=file.name||'data.json';
  const r=new FileReader();
  r.onload=()=>{
    try{
      const loaded=JSON.parse(r.result);
      if(!loaded.settings||!Array.isArray(loaded.shifts)) throw new Error('Invalid schedule data file');
      state=loaded;
      localStorage.setItem(STORE,JSON.stringify(state));
      dataFileHandle=null;
      markClean('Loaded from '+lastLoadedFileName+' · iPhone save will download a replacement file','ok');
      render();
    }catch(e){alert('Invalid data file. Pick the data.json file created for this app.');}
  };
  r.readAsText(file);
}
async function saveICloudData(){
  const text=JSON.stringify(state,null,2);
  // Best case: write directly back to the chosen file.
  if(dataFileHandle && dataFileHandle.createWritable){
    try{
      const writable=await dataFileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      markClean('Saved to '+(lastLoadedFileName||'data.json'),'ok');
      return;
    }catch(err){
      alert('Direct save failed. A downloadable data.json backup will be created instead.');
    }
  }
  // Fallback for iPhone/Safari: download the updated data.json.
  downloadBlob(text,'data.json','application/json');
  markClean('Downloaded updated data.json · move/replace it in iCloud Drive / Schedule','dirty');
  alert('Your updated data.json was downloaded. On iPhone, save/move it into iCloud Drive > Schedule and replace the old data.json file.');
}


async function copyCompatibleAppsScript(){
  const txt=String.raw`const CALENDAR_ID = "PASTE_YOUR_WORK_SCHEDULE_CALENDAR_ID_HERE";
const SECRET_KEY = "PASTE_YOUR_SECRET_KEY_HERE";

function doGet(e) {
  return handleRequest(e);
}

function doPost(e) {
  return handleRequest(e);
}

function handleRequest(e) {
  try {
    const payload = parsePayload(e);
    if (!payload || payload.secret !== SECRET_KEY) {
      return jsonResponse({ ok:false, error:"Unauthorized" });
    }

    const calendar = CalendarApp.getCalendarById(CALENDAR_ID);
    if (!calendar) {
      return jsonResponse({ ok:false, error:"Calendar not found" });
    }

    const shifts = payload.shifts || [];
    const employeeName = payload.employeeName || "";
    let synced = 0;
    let created = 0;
    let updated = 0;
    let deleted = 0;

    removeUnlistedManagedEvents(calendar, payload, employeeName);

    shifts.forEach(function(shift) {
      if (!shift.date) return;

      const managedEvents = findManagedEventsForDate(calendar, shift.date, employeeName);
      const shouldDelete = shift.deleteCalendar === true || shift.status !== "Scheduled" || !shift.start;

      if (shouldDelete) {
        managedEvents.forEach(function(event) {
          event.deleteEvent();
          deleted++;
        });
        synced++;
        return;
      }

      const start = makeDateTime(shift.date, shift.start);
      const end = makeDateTime(shift.date, shift.end || addHoursToTime(shift.start, payload.defaultShiftHours || 9));
      const title = (payload.titlePrefix || "Work") + " " + (shift.location || "Shift");
      const marker = makeMarker(shift.date, employeeName);
      const description = marker + "\nImported from Personal Schedule Manager\n\nNotes: " + (shift.notes || "");

      let event = managedEvents.length ? managedEvents[0] : null;
      if (event) {
        event.setTitle(title);
        event.setTime(start, end);
        event.setLocation(shift.location || "");
        event.setDescription(description);
        event.removeAllReminders();
        event.addPopupReminder(120);
        event.addPopupReminder(60);
        updated++;

        for (let i = 1; i < managedEvents.length; i++) {
          managedEvents[i].deleteEvent();
          deleted++;
        }
      } else {
        event = calendar.createEvent(title, start, end, {
          location: shift.location || "",
          description: description
        });
        event.addPopupReminder(120);
        event.addPopupReminder(60);
        created++;
      }

      synced++;
    });

    return jsonResponse({ ok:true, synced:synced, created:created, updated:updated, deleted:deleted });
  } catch (err) {
    return jsonResponse({ ok:false, error:String(err) });
  }
}

function parsePayload(e) {
  if (e && e.parameter && e.parameter.payload) {
    return JSON.parse(e.parameter.payload);
  }

  const raw = e && e.postData && e.postData.contents ? e.postData.contents : "";
  if (!raw) return {};

  const trimmed = raw.trim();
  if (trimmed.charAt(0) === "{") {
    return JSON.parse(trimmed);
  }

  const parts = trimmed.split("&");
  for (let i = 0; i < parts.length; i++) {
    const pair = parts[i].split("=");
    if (decodeURIComponent(pair[0] || "") === "payload") {
      return JSON.parse(decodeURIComponent((pair.slice(1).join("=") || "").replace(/\+/g, " ")));
    }
  }

  return JSON.parse(trimmed);
}

function removeUnlistedManagedEvents(calendar, payload, employeeName) {
  if (!payload.syncStart || !payload.syncEnd || !payload.shifts) return;

  const keepDates = {};
  payload.shifts.forEach(function(shift) {
    if (shift.date) keepDates[shift.date] = true;
  });

  const start = makeDateTime(payload.syncStart, "00:00");
  const end = makeDateTime(addDays(payload.syncEnd, 1), "00:00");
  const events = calendar.getEvents(start, end);

  events.forEach(function(event) {
    const desc = event.getDescription() || "";
    if (desc.indexOf("Imported from Personal Schedule Manager") === -1) return;

    const eventDate = Utilities.formatDate(event.getStartTime(), Session.getScriptTimeZone(), "yyyy-MM-dd");
    if (!keepDates[eventDate]) {
      event.deleteEvent();
    }
  });
}

function findManagedEventsForDate(calendar, dateStr, employeeName) {
  const events = calendar.getEvents(makeDateTime(dateStr, "00:00"), makeDateTime(dateStr, "23:59"));
  const marker = makeMarker(dateStr, employeeName);
  const legacyStart = "SHIFT-ID:" + dateStr + "-";
  const found = [];

  events.forEach(function(event) {
    const desc = event.getDescription() || "";
    if (
      desc.indexOf(marker) !== -1 ||
      desc.indexOf(legacyStart) !== -1 ||
      desc.indexOf("Imported from Personal Schedule Manager") !== -1
    ) {
      found.push(event);
    }
  });

  return found;
}

function makeMarker(dateStr, employeeName) {
  return "PSM-SHIFT-DATE:" + dateStr + "|EMP:" + (employeeName || "");
}

function makeDateTime(dateStr, timeStr) {
  const p = dateStr.split("-").map(Number);
  const t = timeStr.split(":").map(Number);
  return new Date(p[0], p[1] - 1, p[2], t[0], t[1] || 0, 0);
}

function addHoursToTime(timeStr, hours) {
  const t = timeStr.split(":").map(Number);
  const d = new Date(2000, 0, 1, t[0], t[1] || 0, 0);
  d.setHours(d.getHours() + Number(hours || 9));
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function addDays(dateStr, days) {
  const p = dateStr.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  d.setDate(d.getDate() + Number(days || 0));
  return Utilities.formatDate(d, Session.getScriptTimeZone(), "yyyy-MM-dd");
}

function jsonResponse(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;
  try{
    await navigator.clipboard.writeText(txt);
    alert('Compatible Apps Script v6 copied. Paste it into Apps Script, update CALENDAR_ID, then deploy as a new version.');
  }catch(e){
    alert(txt.slice(0,3000));
  }
}

function scheduleDaysForSync(){

    day:s.day||day3(s.date),
    start:s.status==='Scheduled'?(s.start||''):'',
    end:s.status==='Scheduled'?(s.end||''):'',
    status:s.status==='Scheduled'?'Scheduled':'Off',
    location:s.status==='Scheduled'?(s.location||''):'',
    notes:s.status==='Scheduled'?(s.notes||''):'',

}
function scheduledShiftsForSync(){

}
function googleCalendarPayload(){

async function syncToGoogleCalendar(){
  ensureSettingsDefaults();
  const url=String(state.settings.googleScriptUrl||'').trim();
  const secret=String(state.settings.googleScriptSecret||'').trim();
  const shifts=scheduleDaysForSync();
  const scheduledCount=shifts.filter(s=>s.status==='Scheduled'&&s.start).length;
  if(!url)return alert('Add your Apps Script Web App URL in Setup.');
  if(!secret)return alert('Add your secret key in Setup.');
  if(!shifts.length)return alert('No schedule days to sync.');

  const payload=googleCalendarPayload();
  const body=JSON.stringify(payload);
  const btns=[document.getElementById('googleSyncBtn'),document.getElementById('setupGoogleSyncBtn')].filter(Boolean);
  btns.forEach(b=>{b.disabled=true;b.textContent='Syncing';});
  updateSyncStatus('Sending shifts to Google Calendar...','dirty');

  let confirmed=false;
  let lastError='';

  // 1) Desktop/normal-browser path: POST and read the Apps Script JSON response.
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body});
    const txt=await res.text();
    let data=null;
    try{data=JSON.parse(txt)}catch(e){}
    if(data&&data.ok===false)throw new Error(data.error||'Apps Script returned failure');
    if(!res.ok)throw new Error('HTTP '+res.status+' '+txt.slice(0,180));
    confirmed=true;
  }catch(err){
    lastError=err&&err.message?err.message:String(err);
  }

  btns.forEach(b=>{b.disabled=false;b.textContent=b.id==='googleSyncBtn'?'Sync':'Sync Scheduled Shifts';});

  if(confirmed){
    const msg=`Sync completed. ${shifts.length} schedules sent.`;
    updateSyncStatus(msg,'ok');
    alert(msg);
    return;
  }

  // 2) iPhone/Edge/Safari local-file test path:
  // Hidden iframe GET fallback. This avoids the Apps Script pop-up/tab.
  // It cannot read the response, so confirmation must be checked in Google Calendar.
  try{
    const getUrl=buildGoogleSyncGetUrl(url,body);
    if(getUrl.length>=7500)throw new Error('Payload too large for phone GET sync. Use Add All calendar export or sync from desktop.');
    postGoogleSyncViaHiddenGet(getUrl);
    const msg=`Sync completed. ${shifts.length} schedules sent.`;
    updateSyncStatus(msg,'ok');
    alert(msg);
  }catch(err){
    updateSyncStatus('Google sync could not be sent','dirty');
    alert('Google Calendar sync could not be sent from this browser. Details: '+(err&&err.message?err.message:err)+'\n\nDesktop POST error was: '+lastError);
  }
}
function openUrlInNewWindow(url){
  try{
    const w=window.open(url,'_blank','noopener,noreferrer');
    if(w)return true;
  }catch(e){}
  try{
    const a=document.createElement('a');
    a.href=url;
    a.target='_blank';
    a.rel='noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{try{a.remove()}catch(e){}},500);
    return true;
  }catch(e){return false;}
}

function buildGoogleSyncGetUrl(url,json){

}

function calendarTitle(s){return `${state.settings.calendarTitlePrefix||'Work'} ${s.location||'Shift'}`.trim()}
function icsDate(iso,time){return iso.replace(/-/g,'')+'T'+(time||'09:00').replace(':','')+'00'}
function makeICS(shifts){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Personal Schedule Manager//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Work Schedule','X-WR-TIMEZONE:America/Chicago'];shifts.forEach(s=>{if(s.status!=='Scheduled'||!s.start)return;let end=s.end||numToTime(timeToNum(s.start)+state.settings.defaultShiftHours);lines.push('BEGIN:VEVENT',`UID:${stableUID(s)}`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,`DTSTART:${icsDate(s.date,s.start)}`,`DTEND:${icsDate(s.date,end)}`,`SUMMARY:${escapeICS(calendarTitle(s))}`,`LOCATION:${escapeICS(s.location||'')}`,`DESCRIPTION:${escapeICS((s.notes||'')+'\n\nImported from Personal Schedule Manager')}`,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Work shift starts in 2 hours','TRIGGER:-PT2H','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Work shift starts in 1 hour','TRIGGER:-PT1H','END:VALARM','END:VEVENT')});lines.push('END:VCALENDAR');return lines.join('\r\n')}
function stableUID(s){return `${s.date}-${s.start}-${(s.location||'shift').replace(/[^a-z0-9]/gi,'')}@personal-schedule-manager.local`}
function numToTime(n){n=((n%24)+24)%24;let h=Math.floor(n),m=Math.round((n-h)*60);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function escapeICS(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function downloadICS(shifts,name){const valid=(shifts||[]).filter(Boolean).filter(s=>s.status==='Scheduled'&&s.start);if(!valid.length)return alert('No scheduled shifts with start times to export.');downloadBlob(makeICS(valid),name||'schedule.ics','text/calendar')}
function googleLink(s){if(!s||s.status!=='Scheduled')return'#';let end=s.end||numToTime(timeToNum(s.start)+state.settings.defaultShiftHours);let dates=`${icsDate(s.date,s.start)}/${icsDate(s.date,end)}`;return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(calendarTitle(s))}&dates=${dates}&location=${encodeURIComponent(s.location||'')}&details=${encodeURIComponent(s.notes||'')}`}
function downloadBlob(text,name,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}

(function applyMobileEditDefaults(){

function allAvailableLocations(){
  const found=[];
  function add(v){
    v=String(v||'').trim();
    if(v && !found.some(x=>x.toLowerCase()===v.toLowerCase())) found.push(v);
  }
  String(state.settings.locations||'').split(/[\n,]+/).forEach(add);
  add(state.settings.defaultLocation);
  (state.shifts||[]).forEach(s=>add(s.location));
  ['U of C','Prep Shift','Catering','Commissary','Event'].forEach(add);
  return found;
}

function hourOptions(selected='',allowBlank=false){
  const opts=[];
  if(allowBlank) opts.push(`<option value="" ${!selected?'selected':''}>Blank / use default hours</option>`);
  const known=[];
  for(let h=0;h<24;h++){
    const v=String(h).padStart(2,'0')+':00';
    known.push(v);
    opts.push(`<option value="${v}" ${selected===v?'selected':''}>${fmtTime(v,true)}</option>`);
  }
  if(selected && !known.includes(selected)) opts.unshift(`<option value="${esc(selected)}" selected>${esc(fmtTime(selected,true)||selected)}</option>`);
  return opts.join('');
}

function locationOptions(selected=''){
  return allAvailableLocations().map(loc=>`<option value="${esc(loc)}" ${String(loc).toLowerCase()===String(selected||'').toLowerCase()?'selected':''}>${esc(loc)}</option>`).join('');
}

function setShiftOff(date){
  const i=shiftIndexByDate(date); if(i<0)return;
  const sh=state.shifts[i];
  sh.status='Off'; sh.start=''; sh.end=''; sh.location=''; sh.notes=''; sh.calendarDelete=true; sh.editedAt=new Date().toISOString();
  saveAfterInlineEdit('Set '+(sh.day||day3(sh.date))+' '+mdy(sh.date)+' Off');
  openShiftMenuDate=date; openShiftEditorDate=null; render();
}
function updateShiftField(date,field,value){
  const i=shiftIndexByDate(date); if(i<0)return;
  const sh=state.shifts[i];
  sh.status='Scheduled'; sh.calendarDelete=false;
  if(field==='start'||field==='end') sh[field]=value;
  else sh[field]=String(value||'').trim();
  if(field==='location' && sh.location){
    const locs=allAvailableLocations();
    if(!locs.some(x=>x.toLowerCase()===sh.location.toLowerCase())){
      state.settings.locations=(state.settings.locations?state.settings.locations+'\n':'')+sh.location;
    }
  }
  sh.editedAt=new Date().toISOString();
  saveAfterInlineEdit('Edited '+(sh.day||day3(sh.date))+' '+mdy(sh.date));
  openShiftMenuDate=date; openShiftEditorDate=date; render();
}

function syncOneDay(date){
  const i=shiftIndexByDate(date); if(i<0)return alert('Day not found.');
  return syncPayloadToGoogle([scheduleDayForSync(state.shifts[i])], `Sync completed. 1 schedule sent.`);
}

function scheduleDayForSync(s){
  return {
    date:s.date,
    day:s.day||day3(s.date),
    start:s.status==='Scheduled'?(s.start||''):'',
    end:s.status==='Scheduled'?(s.end||''):'',
    status:s.status==='Scheduled'?'Scheduled':'Off',
    location:s.status==='Scheduled'?(s.location||''):'',
    notes:s.status==='Scheduled'?(s.notes||''):'',
    title:calendarTitle(s),
    deleteCalendar:s.status!=='Scheduled'||!s.start||s.calendarDelete===true
  };
}

async function syncPayloadToGoogle(days,successMsg){
  ensureSettingsDefaults();
  const url=String(state.settings.googleScriptUrl||'').trim();
  const secret=String(state.settings.googleScriptSecret||'').trim();
  if(!url)return alert('Add your Apps Script Web App URL in Setup.');
  if(!secret)return alert('Add your secret key in Setup.');
  if(!days.length)return alert('No schedule days to sync.');
  const dates=days.map(s=>s.date).sort();
  const payload={
    secret:state.settings.googleScriptSecret||'',
    titlePrefix:state.settings.calendarTitlePrefix||state.settings.businessName||'Work',
    defaultShiftHours:state.settings.defaultShiftHours||10,
    source:'Personal Schedule Manager HTML',
    employeeName:state.settings.employeeName||'',
    syncStart:dates[0]||'',
    syncEnd:dates[dates.length-1]||'',
    shifts:days
  };
  const body=JSON.stringify(payload);
  updateSyncStatus('Sending to Google Calendar...','dirty');
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body});
    const txt=await res.text();
    let data=null; try{data=JSON.parse(txt)}catch(e){}
    if(data&&data.ok===false)throw new Error(data.error||'Apps Script returned failure');
    if(!res.ok)throw new Error('HTTP '+res.status+' '+txt.slice(0,180));
    updateSyncStatus(successMsg,'ok'); alert(successMsg); return;
  }catch(e){
    try{
      const getUrl=buildGoogleSyncGetUrl(url,body);
      if(getUrl.length>=7500)throw new Error('Payload too large for phone GET sync.');
      postGoogleSyncViaHiddenGet(getUrl);
      updateSyncStatus(successMsg,'ok'); alert(successMsg); return;
    }catch(err){
      updateSyncStatus('Google sync could not be sent','dirty');
      alert('Google Calendar sync could not be sent. Details: '+(err&&err.message?err.message:err));
    }
  }
}

function scheduleShareLines(){
  return (state.shifts||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{
    const day=s.day||day3(s.date);
    const date=mdy(s.date);
    if(s.status!=='Scheduled') return `${day} | ${date} | OFF |  | `;
    return `${day} | ${date} | ${fmtTime(s.start,true)||''} | ${s.end?fmtTime(s.end,true):''} | ${s.location||''}`;
  }).join('\n');
}
async function shareScheduleText(){
  const text=scheduleShareLines();
  if(navigator.share){try{await navigator.share({title:'My Schedule',text});return;}catch(e){}}
  try{await navigator.clipboard.writeText(text);alert('Schedule copied as text.');}
  catch(e){alert(text);}
}
function drawScheduleCanvas(type='image/png'){
  const lines=scheduleShareLines().split('\n');
  const scale=2, width=900, lineH=42, pad=34, headerH=70;
  const height=pad*2+headerH+lines.length*lineH;
  const canvas=document.createElement('canvas'); canvas.width=width*scale; canvas.height=height*scale;
  const ctx=canvas.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle='#fffdf8'; ctx.fillRect(0,0,width,height);
  ctx.strokeStyle='#ded8cc'; ctx.strokeRect(0,0,width,height);
  ctx.fillStyle='#202124'; ctx.font='bold 28px Arial'; ctx.fillText(`${state.settings.employeeName||'My'} Schedule`,pad,pad+24);
  ctx.fillStyle='#6b6f76'; ctx.font='16px Arial'; ctx.fillText(`${state.settings.businessName||''}`,pad,pad+50);
  ctx.fillStyle='#315c49'; ctx.font='bold 17px Arial'; ctx.fillText('Day | Date | Start Time | End Time | Location',pad,pad+headerH);
  ctx.fillStyle='#202124'; ctx.font='20px Arial';
  let y=pad+headerH+lineH;
  lines.forEach(line=>{ctx.fillText(line,pad,y); y+=lineH;});
  return canvas;
}
async function shareScheduleImage(type){
  const canvas=drawScheduleCanvas(type);
  const ext=type==='image/jpeg'?'jpg':'png';
  canvas.toBlob(async blob=>{
    const file=new File([blob],`schedule.${ext}`,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'My Schedule'});return;}catch(e){}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`schedule.${ext}`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),800);
  },type,0.92);
}
